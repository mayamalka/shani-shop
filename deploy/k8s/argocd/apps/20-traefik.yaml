# Traefik = Gateway API implementation, exposed through the Always Free OCI Network Load Balancer.
# Only Cloudflare can reach it (Terraform restricts the security lists to Cloudflare's ranges), and only
# X-Forwarded-For from Cloudflare is trusted → the API sees the real visitor IP (rate limits, logs).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.1.3
    helm:
      releaseName: traefik
      valuesObject:
        deployment:
          replicas: 2
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 256Mi }
        ingressClass:
          enabled: false
        providers:
          kubernetesIngress:
            enabled: false
          kubernetesGateway:
            enabled: true
        gatewayClass:
          enabled: true # GatewayClass "traefik"
        gateway:
          enabled: false # our Gateway is deploy/k8s/platform/gateway.yaml
        api:
          dashboard: false
        ports:
          web:
            forwardedHeaders: &cloudflare
              trustedIPs:
                # https://www.cloudflare.com/ips/ – Renovate can't track this list; re-check yearly
                - 173.245.48.0/20
                - 103.21.244.0/22
                - 103.22.200.0/22
                - 103.31.4.0/22
                - 141.101.64.0/18
                - 108.162.192.0/18
                - 190.93.240.0/20
                - 188.114.96.0/20
                - 197.234.240.0/22
                - 198.41.128.0/17
                - 162.158.0.0/15
                - 104.16.0.0/13
                - 104.24.0.0/14
                - 172.64.0.0/13
                - 131.0.72.0/22
                - 2400:cb00::/32
                - 2606:4700::/32
                - 2803:f800::/32
                - 2405:b500::/32
                - 2405:8100::/32
                - 2a06:98c0::/29
                - 2c0f:f248::/32
          websecure:
            forwardedHeaders: *cloudflare
        service:
          annotations:
            oci.oraclecloud.com/load-balancer-type: nlb # Network Load Balancer = Always Free
            oci-network-load-balancer.oraclecloud.com/is-preserve-source: "true"
            oci-network-load-balancer.oraclecloud.com/security-list-management-mode: None # Terraform owns the rules
          spec:
            externalTrafficPolicy: Local # keep the client (Cloudflare) IP
            loadBalancerIP: 151.145.90.121 # terraform output public_ip – stable DNS target
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        shop.gateway/allowed: "true" # lets the www→apex redirect route attach to the HTTPS listener
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
