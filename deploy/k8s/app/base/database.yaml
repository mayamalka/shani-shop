# PostgreSQL managed by CloudNativePG. Continuous WAL archiving + nightly base backups to Cloudflare R2
# through the Barman Cloud plugin → point-in-time recovery for the last 30 days.
# CNPG creates the secret "shani-db-app" (key "uri") that the API uses as DATABASE_URL.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: r2-backups
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://shani-db-backups/
    endpointURL: https://ACCOUNT_ID.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId:
        name: r2-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: r2-backup-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  # R2 doesn't support every newer AWS checksum feature – only use them when required
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shani-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # one instance fits the Always Free block-volume budget; recovery comes from the R2 backups
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.10-standard-trixie
  bootstrap:
    initdb:
      database: shani
      owner: shani
      encoding: UTF8
      localeCollate: C.UTF-8
      localeCType: C.UTF-8
  storage:
    size: 50Gi # OCI block volumes are 50 GB minimum
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      memory: 1Gi
  postgresql:
    parameters:
      shared_buffers: 128MB
      max_connections: "50"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: r2-backups
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: shani-db-nightly
spec:
  schedule: "0 30 1 * * *" # 01:30 UTC every night (6 fields: seconds first)
  immediate: true
  backupOwnerReference: self
  cluster:
    name: shani-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
