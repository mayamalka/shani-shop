# One public origin: the browser calls /api and /media on the same host as the site
# (same-origin fetch + SameSite=Strict admin cookies depend on it).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: https
  hostnames:
    - hadoda-shani.co.il
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
        - path: { type: PathPrefix, value: /media }
      backendRefs:
        - name: api
          port: 80
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: web
          port: 80
