# Migrations run once per Argo CD sync: after the database (wave 0), before the new API pods (wave 2).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6 # keeps retrying while the database is still starting on the very first deploy
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      enableServiceLinks: false # no Docker-link env vars – the Service "api" would inject API_PORT=tcp://… and break the config
      containers:
        - name: migrate
          image: shani-api
          command: [node, apps/api/dist/migrate.js]
          envFrom:
            - configMapRef:
                name: shop-config
            - secretRef:
                name: api-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shani-db-app
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
# Privacy housekeeping every 6 hours: deletes customer photos past their retention period
# and abandoned (unpaid) checkouts. Replaces the in-process timer (PURGE_TIMER=false).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: purge-photos
spec:
  schedule: "17 */6 * * *"
  timeZone: Asia/Jerusalem
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: purge-photos
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          enableServiceLinks: false # no Docker-link env vars – the Service "api" would inject API_PORT=tcp://… and break the config
          containers:
            - name: purge
              image: shani-api
              command: [node, apps/api/dist/purge.js]
              envFrom:
                - configMapRef:
                    name: shop-config
                - secretRef:
                    name: api-secrets
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: shani-db-app
                      key: uri
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 384Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
