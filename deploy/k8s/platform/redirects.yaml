# http://… → https://…  (Cloudflare "Always Use HTTPS" normally catches this first)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: traefik
spec:
  parentRefs:
    - name: public
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# https://www.… → https://…
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www-redirect
  namespace: traefik
spec:
  parentRefs:
    - name: public
      sectionName: https
  hostnames:
    - www.hadoda-shani.co.il
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: hadoda-shani.co.il
            statusCode: 301
