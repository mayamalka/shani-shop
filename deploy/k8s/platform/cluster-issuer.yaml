# Let's Encrypt via DNS-01 on Cloudflare – works while the site sits behind the Cloudflare proxy.
# The token (Zone:DNS:Edit for the shop's zone) is the SealedSecret cert-manager/cloudflare-api-token.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@shop.example.com # expiry warnings go here
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
