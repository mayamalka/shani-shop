name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shani
          POSTGRES_PASSWORD: shani
          POSTGRES_DB: shani
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shani"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://shani:shani@localhost:5432/shani_test
      E2E_DATABASE_URL: postgresql://shani:shani@localhost:5432/shani_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + API integration tests
        run: npm test
      - name: Install Playwright browsers (Chromium + WebKit for iPhone)
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests (desktop, Android, iPhone)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The production images build and start (amd64 here for speed; release.yml builds arm64 for the cluster).
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          load: true
          tags: shani-api:ci
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,scope=ci-api,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          load: true
          tags: shani-web:ci
          cache-from: type=gha,scope=ci-web
          cache-to: type=gha,scope=ci-web,mode=max
      - name: Smoke test web image (SPA fallback, cache + security headers)
        run: |
          docker run -d --name web --read-only --tmpfs /tmp -p 8080:8080 shani-web:ci
          for i in $(seq 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fsI localhost:8080/shop/some-product | tee h.txt
          grep -qi '^content-security-policy:.*frame-ancestors .none.' h.txt
          grep -qi '^cache-control: no-cache' h.txt
          grep -qi '^strict-transport-security:' h.txt
          asset=$(curl -fs localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fsI "localhost:8080$asset" | grep -qi 'immutable'
      - name: Smoke test API image (CLIs bundled, native modules load, starts)
        run: |
          docker run --rm --read-only shani-api:ci ls apps/api/dist/index.js apps/api/dist/migrate.js apps/api/dist/purge.js apps/api/dist/seed.js apps/api/dist/create-admin.js
          docker run --rm --read-only shani-api:ci node -e "require('sharp'); require('argon2'); console.log('native modules ok')"

  # Kubernetes manifests render and match their schemas; Terraform is formatted and valid.
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | sudo tar xz -C /usr/local/bin kubeconform
      - name: Render + validate
        run: |
          set -o pipefail
          mkdir -p rendered
          kubectl kustomize deploy/k8s/app/prod > rendered/shop.yaml
          kubectl kustomize deploy/k8s/platform > rendered/platform.yaml
          cp deploy/k8s/argocd/root.yaml deploy/k8s/argocd/apps/*.yaml rendered/
          kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.7
      - name: Terraform fmt + validate
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
