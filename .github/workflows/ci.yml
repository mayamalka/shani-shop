name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shani
          POSTGRES_PASSWORD: shani
          POSTGRES_DB: shani
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shani"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://shani:shani@localhost:5432/shani_test
      E2E_DATABASE_URL: postgresql://shani:shani@localhost:5432/shani_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + API integration tests
        run: npm test
      - name: Install Playwright browsers (Chromium + WebKit for iPhone)
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests (desktop, Android, iPhone)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
