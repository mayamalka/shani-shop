# After CI passes on main: build both arm64 images, push them to GHCR, then point the prod overlay
# at the new tags. Argo CD sees the commit and rolls the shop out (migrate Job → new pods).
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  images:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Image name
        id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shani-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.repo }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.name.outputs.repo }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point the prod overlay at the new images
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for img in api web; do
            yq -i "(.images[] | select(.name == \"shani-$img\")) |= (.newName = \"ghcr.io/$owner/shani-$img\" | .newTag = \"$SHA\")" \
              deploy/k8s/app/prod/kustomization.yaml
          done
          git diff --stat
      - name: Commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/app/prod/kustomization.yaml
          git diff --cached --quiet && { echo "already deployed"; exit 0; }
          git commit -m "deploy: ${SHA::7}"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
