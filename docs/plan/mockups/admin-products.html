<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>עריכת מוצר – ניהול</title>
<link rel="stylesheet" href="common.css">
<style>
.lay{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start}
.list a{display:flex;justify-content:space-between;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--brown);font-weight:500}
.list a.on{background:var(--soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gal{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.gal .felt::after{inset:4px;border-width:1px}
.add{border:2px dashed var(--orange);border-radius:18px;display:grid;place-items:center;font-size:30px;color:var(--burnt);aspect-ratio:1;background:#FFF4E2}
.disc{background:#FFF0EE;border:2px solid #F3B9B0;border-radius:16px;padding:14px}
.preview{display:flex;align-items:center;gap:12px;font-size:20px;margin-top:8px}
.sw{display:inline-block;width:46px;height:26px;border-radius:999px;background:var(--burnt);position:relative;vertical-align:middle}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff}
h2{font-size:21px;margin:16px 0 10px}
.actions{display:flex;gap:10px;margin-top:20px}
</style></head><body>
<main id="main" class="wrap" style="max-width:1300px">
 <div class="lay">
  <aside class="card list"><h2 style="margin-top:0">מוצרים</h2>
   <a href="#">ספר מוכן 1–3 <span class="hint">פעיל</span></a><a href="#" class="on">ספר מוכן 3–5 <span class="hint">מבצע</span></a><a href="#">ספר בהרכבה <span class="hint">9 עמודים</span></a><a href="#">מחזיק מוצץ <span class="hint">פשוט</span></a>
   <a class="btn" style="width:100%;margin-top:12px;justify-content:center">+ מוצר חדש</a>
   <a class="btn sec" style="width:100%;margin-top:8px;justify-content:center;font-size:15px">ניהול עמודי הרכבה</a></aside>
  <form class="card">
   <div style="display:flex;justify-content:space-between;align-items:center"><h1 style="font-size:30px">עריכת מוצר: ספר מוכן 3–5</h1><span>פעיל באתר <span class="sw"></span></span></div>
   <div class="two" style="margin-top:14px"><div class="field"><label>כותרת</label><input value="ספר מוכן לגילאי 3–5"></div><div class="field"><label>מחיר רגיל (₪)</label><input value="300"></div></div>
   <div class="field"><label>תיאור</label><textarea rows="3">רוכסנים, כפתורים, ספירה ושעון – אתגרים לידיים קטנות. 12 עמודים עם תמונות ושמות המשפחה.</textarea></div>
   <h2>גלריה <span class="hint">(גררו לשינוי סדר · התמונה הראשונה היא הראשית)</span></h2>
   <div class="gal"><div data-felt="house" data-i="3"></div><div data-felt="car" data-i="4"></div><div data-felt="apple" data-i="2"></div><div data-felt="flower" data-i="7"></div><div data-felt="tree" data-i="5"></div><div class="add" aria-label="הוספת תמונה">+</div></div>
   <h2>הנחה</h2>
   <div class="disc"><div class="two"><div class="field"><label>מחיר מבצע (₪)</label><input value="270"></div><div class="field"><label>בתוקף עד (לא חובה)</label><input value="31/12/2026"></div></div>
    <div class="hint">תצוגה באתר:</div><div class="preview"><b style="color:var(--red)">270 ₪</b><s style="color:var(--red)">300 ₪</s><span class="hint">· בקופה ייגבה 270 ₪</span></div></div>
   <div class="actions"><button class="btn">שמירה</button><button class="btn sec">ביטול</button><button class="btn sec" style="margin-inline-start:auto;color:var(--red);border-color:var(--red)">הסרת הנחה</button></div>
  </form>
 </div>
</main>
<script src="common.js"></script><script>mount('products',{admin:true,count:0,noFooter:true});</script>
</body></html>
